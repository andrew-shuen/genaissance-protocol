<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="24" fill="#ffffff"/><rect x="20" y="20" width="1160" height="300" rx="22" fill="#eef7f1"/><text x="48" y="62" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#2e7d4f">Normal : un frein à la division cellulaire</text><rect x="20" y="340" width="1160" height="300" rx="22" fill="#fdf0ef"/><text x="48" y="382" font-family="Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#b4474f">Frein perdu</text><circle cx="210" cy="165" r="46" fill="#cfe6f5" stroke="#fff" stroke-width="3"/><circle cx="210" cy="165" r="19" fill="#a3c8e3"/><circle cx="170" cy="95" r="9" fill="#e8c25a"/><circle cx="200" cy="105" r="9" fill="#e8c25a"/><circle cx="230" cy="95" r="9" fill="#e8c25a"/><text x="210" y="270" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24424f" text-anchor="middle">La cellule reçoit un</text><text x="210" y="292" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24424f" text-anchor="middle">signal de division</text><path d="M375 190 h34" stroke="#9fb3c2" stroke-width="4" stroke-linecap="round"/><path d="M405 182 l12 8 l-12 8z" fill="#9fb3c2"/><ellipse cx="535" cy="165" rx="36" ry="26" fill="#4a90c2" opacity=".95"/><text x="535" y="170" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">p16</text><ellipse cx="630" cy="165" rx="40" ry="26" fill="#9fb3c2" opacity=".95"/><text x="630" y="170" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CDK4</text><path d="M570 165 h12" stroke="#24424f" stroke-width="5"/><text x="590" y="270" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24424f" text-anchor="middle">p16 (CDKN2A) retient CDK4</text><path d="M755 190 h34" stroke="#9fb3c2" stroke-width="4" stroke-linecap="round"/><path d="M785 182 l12 8 l-12 8z" fill="#9fb3c2"/><circle cx="930" cy="165" r="46" fill="#cfe6f5" stroke="#fff" stroke-width="3"/><circle cx="930" cy="165" r="19" fill="#a3c8e3"/><circle cx="987.5" cy="165" r="37" fill="#cfe6f5" stroke="#fff" stroke-width="3"/><circle cx="987.5" cy="165" r="15" fill="#a3c8e3"/><circle cx="1080" cy="125" r="20" fill="#4caf7a"/><path d="M1068 125 l8 9 l16 -18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="970" y="270" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24424f" text-anchor="middle">Se divise</text><text x="970" y="292" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24424f" text-anchor="middle">seulement au besoin</text><ellipse cx="155" cy="485" rx="36" ry="26" fill="#9fb3c2" opacity=".95"/><text x="155" y="490" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">p16</text><ellipse cx="250" cy="485" rx="40" ry="26" fill="#f2a65a" opacity=".95"/><text x="250" y="490" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CDK4</text><circle cx="155" cy="535" r="14" fill="#e5737a"/><path d="M147 527 l16 16 M163 527 l-16 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="210" y="590" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#24424f" text-anchor="middle">p16 manque</text><text x="210" y="612" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#6b7c88" text-anchor="middle">(ou CDK4 ne peut plus être retenu)</text><path d="M375 510 h34" stroke="#9fb3c2" stroke-width="4" stroke-linecap="round"/><path d="M405 502 l12 8 l-12 8z" fill="#9fb3c2"/><circle cx="530" cy="485" r="36" fill="#f3c2c2" stroke="#fff" stroke-width="3"/><circle cx="530" cy="485" r=