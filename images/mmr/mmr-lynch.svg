<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="790" fill="#fff"/><text x="30" y="42" font-size="20" font-weight="800" fill="#0b3d5c">Mismatch repair (MMR): the pathway lost in Lynch syndrome</text><text x="30" y="66" font-size="14" fill="#456">Corrects replication errors in the newly made DNA strand</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0b3d5c"/></marker></defs><rect x="30" y="90" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="108" r="11" fill="#2e7d4f"/><text x="46" y="112" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="64" y="113" font-size="14" font-weight="700" fill="#0b2a3c">Replication error</text><text x="42" y="134" font-size="12" fill="#233">Base–base mismatch or small insertion/deletion loop (IDL),</text><text x="42" y="150" font-size="12" fill="#233">often in repetitive microsatellites.</text><line x1="310.0" y1="162" x2="310.0" y2="182" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="184" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="202" r="11" fill="#2e7d4f"/><text x="46" y="206" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="64" y="207" font-size="14" font-weight="700" fill="#0b2a3c">Recognition: MutSα or MutSβ</text><text x="42" y="228" font-size="12" fill="#233">MutSα = MSH2–MSH6 (mismatches, 1–2 base loops).</text><text x="42" y="244" font-size="12" fill="#233">MutSβ = MSH2–MSH3 (larger loops).</text><line x1="310.0" y1="256" x2="310.0" y2="276" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="278" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="296" r="11" fill="#2e7d4f"/><text x="46" y="300" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="64" y="301" font-size="14" font-weight="700" fill="#0b2a3c">MutLα (MLH1–PMS2) nicks the new strand</text><text x="42" y="322" font-size="12" fill="#233">Recruited by MutS with PCNA; PMS2 endonuclease cuts</text><text x="42" y="338" font-size="12" fill="#233">the newly synthesized (daughter) strand.</text><line x1="310.0" y1="350" x2="310.0" y2="370" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="372" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="390" r="11" fill="#2e7d4f"/><text x="46" y="394" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="64" y="395" font-size="14" font-weight="700" fill="#0b2a3c">Excision: EXO1</text><text x="42" y="416" font-size="12" fill="#233">Removes the stretch of new strand containing the error.</text><line x1="310.0" y1="444" x2="310.0" y2="464" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="466" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="484" r="11" fill="#2e7d4f"/><text x="46" y="488" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="64" y="489" font-size="14" font-weight="700" fill="#0b2a3c">Resynthesis: DNA polymerase δ</text><text x="42" y="510" font-size="12" fill="#233">Fills the gap using the parental strand as template.</text><line x1="310.0" y1="538" x2="310.0" y2="558" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="560" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="578" r="11" fill="#2e7d4f"/><text x="46" y="582" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="64" y="583" font-size="14" font-weight="700" fill="#0b2a3c">Ligation: DNA ligase I</text><text x="42" y="604" font-size="12" fill="#233">Seals the nick.</text><line x1="310.0" y1="632" x2="310.0" y2="652" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="654" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="672" r="11" fill="#2e7d4f"/><text x="46" y="676" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="64" y="677" font-size="14" font-weight="700" fill="#0b2a3c">Accurate repair</text><text x="42" y="698" font-size="12" fill="#233">Correct sequence restored.</text><rect x="630" y="90" width="540" height="80" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="642" y="113" font-size="14" font-weight="700" fill="#0b2a3c">When MMR is lost (second hit in a Lynch tumour)</text><text x="642" y="134" font-size="12" fill="#233">Errors accumulate, especially in microsatellites →</text><text x="642" y="150" font-size="12" fill="#233">microsatellite instability (MSI-H) and very high mutation burden.</text><rect x="630" y="188" width="540" height="130" rx="10" fill="#eef6fb" stroke="#1f6fb2" stroke-width="1.5"/><text x="642" y="211" font-size="14" font-weight="700" fill="#0b2a3c">Immunohistochemistry (IHC) patterns</text><text x="642" y="232" font-size="12" fill="#233">Loss of MLH1 → MLH1 + PMS2 absent (PMS2 unstable without MLH1)</text><text x="642" y="248" font-size="12" fill="#233">Loss of MSH2 → MSH2 + MSH6 absent (MSH6 unstable without MSH2)</text><text x="642" y="264" font-size="12" fill="#233">Isolated PMS2 loss → suspect PMS2 (or MLH1 missense)</text><text x="642" y="280" font-size="12" fill="#233">Isolated MSH6 loss → suspect MSH6</text><text x="642" y="296" font-size="12" fill="#233">MLH1/PMS2 loss: test MLH1 promoter methylation / BRAF V600E (sporadic)</text><rect x="630" y="336" width="540" height="96" rx="10" fill="#f4eefb" stroke="#6b3fa0" stroke-width="1.5"/><text x="642" y="359" font-size="14" font-weight="700" fill="#0b2a3c">EPCAM 3′ deletion</text><text x="642" y="380" font-size="12" fill="#233">Deletion of EPCAM’s last exons removes its stop/polyA signal;</text><text x="642" y="396" font-size="12" fill="#233">transcription reads into MSH2 → MSH2 promoter methylated</text><text x="642" y="412" font-size="12" fill="#233">→ MSH2 silenced in EPCAM-expressing tissues. IHC: MSH2/MSH6 loss.</text><rect x="630" y="450" width="540" height="96" rx="10" fill="#fff6e0" stroke="#b7791f" stroke-width="1.5"/><text x="642" y="473" font-size="14" font-weight="700" fill="#0b2a3c">Immune checkpoint inhibitors</text><text x="642" y="494" font-size="12" fill="#233">Many mutations → many neoantigens → tumour visible to T cells.</text><text x="642" y="510" font-size="12" fill="#233">dMMR/MSI-H tumours often respond to PD-1 blockade</text><text x="642" y="526" font-size="12" fill="#233">(e.g. pembrolizumab, dostarlimab).</text><text x="30" y="776" font-size="11" fill="#678">Simplified schematic for patient and clinician education. Sources: GeneReviews Lynch syndrome (NBK1211); Kunkel TA, Erie DA. Annu Rev Biochem 2005; Ligtenberg MJ et al. Nat Genet 2009; Le DT et al. NEJM 2015.</text></svg>