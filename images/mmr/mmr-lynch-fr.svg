<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Inter,Helvetica,Arial,sans-serif"><rect width="1200" height="790" fill="#fff"/><text x="30" y="42" font-size="20" font-weight="800" fill="#0b3d5c">Réparation des mésappariements (MMR) : la voie perdue dans le syndrome de Lynch</text><text x="30" y="66" font-size="14" fill="#456">Corrige les erreurs de réplication dans le brin d’ADN nouvellement synthétisé</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0b3d5c"/></marker></defs><rect x="30" y="90" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="108" r="11" fill="#2e7d4f"/><text x="46" y="112" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="64" y="113" font-size="14" font-weight="700" fill="#0b2a3c">Erreur de réplication</text><text x="42" y="134" font-size="12" fill="#233">Mésappariement de bases ou petite boucle d’insertion/délétion (IDL),</text><text x="42" y="150" font-size="12" fill="#233">souvent dans les microsatellites répétitifs.</text><line x1="310.0" y1="162" x2="310.0" y2="182" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="184" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="202" r="11" fill="#2e7d4f"/><text x="46" y="206" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="64" y="207" font-size="14" font-weight="700" fill="#0b2a3c">Reconnaissance : MutSα ou MutSβ</text><text x="42" y="228" font-size="12" fill="#233">MutSα = MSH2–MSH6 (mésappariements, boucles de 1–2 bases).</text><text x="42" y="244" font-size="12" fill="#233">MutSβ = MSH2–MSH3 (boucles plus grandes).</text><line x1="310.0" y1="256" x2="310.0" y2="276" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="278" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="296" r="11" fill="#2e7d4f"/><text x="46" y="300" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="64" y="301" font-size="14" font-weight="700" fill="#0b2a3c">MutLα (MLH1–PMS2) coupe le nouveau brin</text><text x="42" y="322" font-size="12" fill="#233">Recruté par MutS avec PCNA; l’endonucléase PMS2 coupe</text><text x="42" y="338" font-size="12" fill="#233">le brin fille nouvellement synthétisé.</text><line x1="310.0" y1="350" x2="310.0" y2="370" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="372" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="390" r="11" fill="#2e7d4f"/><text x="46" y="394" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="64" y="395" font-size="14" font-weight="700" fill="#0b2a3c">Excision : EXO1</text><text x="42" y="416" font-size="12" fill="#233">Retire le segment du nouveau brin contenant l’erreur.</text><line x1="310.0" y1="444" x2="310.0" y2="464" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="466" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="484" r="11" fill="#2e7d4f"/><text x="46" y="488" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="64" y="489" font-size="14" font-weight="700" fill="#0b2a3c">Resynthèse : ADN polymérase δ</text><text x="42" y="510" font-size="12" fill="#233">Comble la brèche en copiant le brin parental.</text><line x1="310.0" y1="538" x2="310.0" y2="558" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="560" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="578" r="11" fill="#2e7d4f"/><text x="46" y="582" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="64" y="583" font-size="14" font-weight="700" fill="#0b2a3c">Ligature : ADN ligase I</text><text x="42" y="604" font-size="12" fill="#233">Scelle la coupure.</text><line x1="310.0" y1="632" x2="310.0" y2="652" stroke="#0b3d5c" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="654" width="560" height="72" rx="10" fill="#eef7f1" stroke="#2e7d4f" stroke-width="1.5"/><circle cx="46" cy="672" r="11" fill="#2e7d4f"/><text x="46" y="676" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="64" y="677" font-size="14" font-weight="700" fill="#0b2a3c">Réparation exacte</text><text x="42" y="698" font-size="12" fill="#233">La séquence correcte est rétablie.</text><rect x="630" y="90" width="540" height="80" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="642" y="113" font-size="14" font-weight="700" fill="#0b2a3c">Perte du MMR (deuxième atteinte dans une tumeur de Lynch)</text><text x="642" y="134" font-size="12" fill="#233">Les erreurs s’accumulent, surtout dans les microsatellites →</text><text x="642" y="150" font-size="12" fill="#233">instabilité microsatellitaire (MSI-H) et charge mutationnelle très élevée.</text><rect x="630" y="188" width="540" height="130" rx="10" fill="#eef6fb" stroke="#1f6fb2" stroke-width="1.5"/><text x="642" y="211" font-size="14" font-weight="700" fill="#0b2a3c">Profils en immunohistochimie (IHC)</text><text x="642" y="232" font-size="12" fill="#233">Perte de MLH1 → MLH1 + PMS2 absents (PMS2 instable sans MLH1)</text><text x="642" y="248" font-size="12" fill="#233">Perte de MSH2 → MSH2 + MSH6 absents (MSH6 instable sans MSH2)</text><text x="642" y="264" font-size="12" fill="#233">Perte isolée de PMS2 → suspecter PMS2 (ou faux-sens MLH1)</text><text x="642" y="280" font-size="12" fill="#233">Perte isolée de MSH6 → suspecter MSH6</text><text x="642" y="296" font-size="12" fill="#233">Perte MLH1/PMS2 : méthylation du promoteur MLH1 / BRAF V600E (sporadique)</text><rect x="630" y="336" width="540" height="96" rx="10" fill="#f4eefb" stroke="#6b3fa0" stroke-width="1.5"/><text x="642" y="359" font-size="14" font-weight="700" fill="#0b2a3c">Délétion 3′ d’EPCAM</text><text x="642" y="380" font-size="12" fill="#233">La délétion des derniers exons d’EPCAM supprime son signal d’arrêt;</text><text x="642" y="396" font-size="12" fill="#233">la transcription se poursuit dans MSH2 → méthylation du promoteur</text><text x="642" y="412" font-size="12" fill="#233">→ MSH2 éteint dans les tissus exprimant EPCAM. IHC : perte MSH2/MSH6.</text><rect x="630" y="450" width="540" height="96" rx="10" fill="#fff6e0" stroke="#b7791f" stroke-width="1.5"/><text x="642" y="473" font-size="14" font-weight="700" fill="#0b2a3c">Inhibiteurs de points de contrôle immunitaire</text><text x="642" y="494" font-size="12" fill="#233">Nombreuses mutations → nombreux néoantigènes → tumeur visible aux lymphocytes T.</text><text x="642" y="510" font-size="12" fill="#233">Les tumeurs dMMR/MSI-H répondent souvent au blocage de PD-1</text><text x="642" y="526" font-size="12" fill="#233">(ex. pembrolizumab, dostarlimab).</text><text x="30" y="776" font-size="11" fill="#678">Schéma simplifié à visée éducative. Sources : GeneReviews Lynch (NBK1211); Kunkel TA, Erie DA. Annu Rev Biochem 2005; Ligtenberg MJ et al. Nat Genet 2009; Le DT et al. NEJM 2015.</text></svg>